[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sasisterte-resample"
version = "0.1.0"
description = "在同一个输入里两两比对，检测评测的重采样一致性相关的矛盾表述，把冲突双方原样并排呈现"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "sasisterte" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sasisterte.github.io"
Repository = "https://github.com/sasisterte/resample"
Issues = "https://github.com/sasisterte/resample/issues"

[project.scripts]
resample = "resample:main"

[tool.setuptools]
py-modules = ["resample"]
